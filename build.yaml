framework: "net10.0"
overview: "Converte in film le 'serie' con 1 sola stagione/episodio che alcuni provider VOD espongono come serie"
description: >
  Individua, nelle librerie configurate, le "serie" con esattamente una stagione e un episodio (il modo in
  cui alcuni provider IPTV/VOD espongono i film), le conferma interrogando TMDb e sostituisce la voce
  Series/Season/Episode con una voce Movie che punta allo stesso file .strm, senza mai spostare o
  modificare il file fisico. Eseguibile on-demand da Dashboard > Programmazione attività, oppure
  automaticamente al termine di ogni scansione libreria.
category: "Library"
owner: "HLabSolutions"
