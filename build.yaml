changelog: >
  - 1.0.3.0: Aggiunta l'assegnazione manuale: per i candidati che TMDb non conferma
    automaticamente, la pagina del plugin permette ora di cercarli e assegnarli uno per uno.
  - 1.0.2.0: Le librerie si selezionano ora con delle checkbox (una per libreria)
